# Render blueprint for the backend API (https://render.com -> New -> Blueprint -> pick this repo)
services:
  - type: web
    name: form-saathi-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false          # Render asks you for the value; never commit the key
      - key: GEMINI_API_KEY
        sync: false          # free key for reading photos of forms (aistudio.google.com/apikey)
      - key: CORS_ORIGINS
        sync: false          # your Vercel URL, e.g. https://form-saathi.vercel.app
      - key: SESSION_TTL_MINUTES
        value: "30"
